[project]
name = "ica"
version = "0.1.0"
description = "Independent Component Analysis, following Hyvärinen, Karhunen & Oja (2001)"
readme = "README.md"
authors = [
    { name = "Michel Ferreira", email = "michelmf@poli.ufrj.br" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=7.0.0",
    "ruff>=0.16.5",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
]

[project.scripts]
ica = "ica:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
